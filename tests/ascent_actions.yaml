- action: "add_extracts"
  extracts:
    my_volume_extract:
      type: "volume"
      params:
        field: "gasDensity"
        filename: "volume%05d"
        image_width: 512
        image_height: 512
        camera:
          look_at: [0.5, 0.5, 0.5]
          position: [-1.2, 0.499, 0.501]
          up: [0.0, 0.0, 1.0]
          fov: 60.0
          xpan: 0.0
          ypan: 0.0
          zoom: 1.0
          azimuth: 0.0
          elevation: 0.0
          near_plane: 0.01
          far_plane: 10.0

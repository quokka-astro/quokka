name: 🌊 Hydro Wave Convergence

on:
  workflow_dispatch:
  push:
    branches:
      - development
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-hydro-wave-convergence
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/hydro-wave-convergence.yml'

  hydro_wave_convergence:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install gcc-11 g++-11 python3-dev python3-numpy python3-matplotlib python3-pip libopenmpi-dev libhdf5-mpi-dev libpng-dev

    - name: Install Canary
      run: python3 -m pip install canary-wm

    - name: Configure CMake
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11

    - name: Build test_hydro_wave_convergence
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --config $BUILD_TYPE --parallel 4 --target HydroWaveConvergence

    - name: Create test output directory
      run: cmake -E make_directory $GITHUB_WORKSPACE/tests

    - name: Run Hydro Wave Convergence test
      shell: bash
      working-directory: ${{ runner.workspace }}/build
      run: canary run --output-on-failure --workers=1 -k HydroWaveConvergence .

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: hydro-wave-convergence-results
        path: ${{ github.workspace }}/tests

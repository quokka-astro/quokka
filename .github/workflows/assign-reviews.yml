name: Assign Reviews

on:
  workflow_dispatch:
  schedule:
    # Run daily at 12 PM UTC.
    - cron: "0 12 * * *"

jobs:
  analyze-review-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    env:
      AGENT_SCRIPT_PATH: .github/scripts/openhands-agent-script.py
      ACTION_PLAN_PATH: output/review-actions.json
      PROMPT_LOCATION: ""
      PROMPT_STRING: >
        Use the read-only GITHUB_TOKEN and the GitHub API to inspect open pull requests
        in this repo. Do not write comments, request reviewers, edit pull requests,
        update labels, push commits, or make any other GitHub mutation. Your only output
        is a JSON action plan at output/review-actions.json.

        The JSON file must have this exact top-level shape:
        {
          "version": 1,
          "actions": [
            {
              "type": "comment",
              "pr": 123,
              "reason": "waiting_for_review",
              "body_template": "waiting_for_review",
              "reviewers": ["reviewer-login"]
            },
            {
              "type": "comment",
              "pr": 124,
              "reason": "stale_author",
              "body_template": "stale_author"
            },
            {
              "type": "request_review",
              "pr": 125,
              "reason": "no_reviewers",
              "reviewers": ["reviewer-login"]
            },
            {
              "type": "comment",
              "pr": 125,
              "reason": "assigned_reviewer",
              "body_template": "assigned_reviewer",
              "reviewers": ["reviewer-login"]
            }
          ]
        }

        Only use these action types: comment, request_review.
        Only use these reasons: waiting_for_review, stale_author, no_reviewers, assigned_reviewer.
        Only use these body_template values: waiting_for_review, stale_author, assigned_reviewer.
        Do not include free-form comment bodies. Do not include shell commands,
        instructions, links, markdown, code, tokens, API keys, credentials, secrets,
        private keys, or environment variable values in the JSON. If no actions are
        needed, write {"version": 1, "actions": []}.

        Read the sections below in order, and propose each applicable action in order.
        Do not propose action on the same pull request twice for the same reason.

        # Need Reviewer Action

        Find all open PRs where:
        1. The PR is waiting for review (there are no open review comments or change requests).
        2. The PR is in a clean state (CI passing, no merge conflicts).
        3. The PR is not marked as draft.
        4. The PR has had no activity (comments, commits, reviews) for more than 3 days.
        In this case, propose a waiting_for_review comment to the reviewers:
        [Automatic Post]: This PR seems to be currently waiting for review.
        {reviewer_names}, could you please take a look when you have a chance?

        # Need Author Action

        Find all open PRs where the most recent change or comment was made on the pull
        request more than 5 days ago (use 14 days if the PR is marked as draft).
        In this case, propose a stale_author comment to the author:
        [Automatic Post]: It has been a while since there was any activity on this PR.
        {author}, are you still working on it? If so, please go ahead, request review,
        close it, or request that someone else follow up.

        # Need Reviewers

        Find all open pull requests that:
        1. Have no reviewers assigned to them.
        2. Are not marked as draft.
        3. Were created more than 1 day ago.
        4. CI is passing and there are no merge conflicts.
        For each of these pull requests, read the git blame information for the files,
        and find the most recent and active contributors to the file/location of the
        changes. Propose one of these people as a reviewer, but try not to assign too
        many reviews to any single person. Also propose this message:
        [Automatic Post]: I have assigned {reviewer} as a reviewer based on git blame information.
        Thanks in advance for the help!
      LLM_MODEL: anthropic/claude-sonnet-4-5-20250929
      LLM_BASE_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install OpenHands dependencies
        run: |
          uv pip install --system "openhands-sdk @ git+https://github.com/OpenHands/agent-sdk.git@46cf830ab0d95f977c675a43c1e3869fdb937d71#subdirectory=openhands-sdk"
          uv pip install --system "openhands-tools @ git+https://github.com/OpenHands/agent-sdk.git@46cf830ab0d95f977c675a43c1e3869fdb937d71#subdirectory=openhands-tools"

      - name: Check required configuration
        env:
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "Error: ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi
          if [ -n "$PROMPT_LOCATION" ] && [ -n "$PROMPT_STRING" ]; then
            echo "Error: Both PROMPT_LOCATION and PROMPT_STRING are set."
            echo "Please provide only one in the env section of the workflow file."
            exit 1
          fi
          if [ -z "$PROMPT_LOCATION" ] && [ -z "$PROMPT_STRING" ]; then
            echo "Error: Neither PROMPT_LOCATION nor PROMPT_STRING is set."
            echo "Please set one in the env section of the workflow file."
            exit 1
          fi
          if [ -n "$PROMPT_LOCATION" ]; then
            echo "Prompt location: $PROMPT_LOCATION"
          else
            echo "Using inline PROMPT_STRING (${#PROMPT_STRING} characters)"
          fi
          echo "LLM model: $LLM_MODEL"
          if [ -n "$LLM_BASE_URL" ]; then
            echo "LLM base URL: $LLM_BASE_URL"
          fi

      - name: Run task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: ""
        run: |
          mkdir -p "$(dirname "$ACTION_PLAN_PATH")"
          echo "Running agent script: $AGENT_SCRIPT_PATH"
          if [ -n "$PROMPT_LOCATION" ]; then
            echo "Using prompt from: $PROMPT_LOCATION"
            uv run python "$AGENT_SCRIPT_PATH" "$PROMPT_LOCATION"
          else
            echo "Using PROMPT_STRING (${#PROMPT_STRING} characters)"
            uv run python "$AGENT_SCRIPT_PATH"
          fi
          test -s "$ACTION_PLAN_PATH"
          python -m json.tool "$ACTION_PLAN_PATH" >/dev/null

      - name: Upload logs as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: openhands-assign-reviews-logs
          path: |
            *.log
            output/
          retention-days: 7

      - name: Upload review action plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-actions
          path: ${{ env.ACTION_PLAN_PATH }}
          retention-days: 7

  apply-review-actions:
    runs-on: ubuntu-24.04
    needs: analyze-review-actions
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Download review action plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-actions
          path: output

      - name: Apply validated review actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/apply-review-actions.py output/review-actions.json

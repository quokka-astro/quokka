# Runs clang-tidy on the lines a PR changes, and fails if it finds any warnings.
# The warnings are shown as annotations on the changed lines, and listed in full in the job summary.
name: "clang-tidy: Review"

on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-clang-tidy
  cancel-in-progress: true

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/clang-tidy-review.yml'

  clang-tidy:
    runs-on: ubuntu-24.04
    needs: check_changes
    # Scripts are not built, but are still linted.
    if: needs.check_changes.outputs.has_non_docs_changes == 'true' || needs.check_changes.outputs.has_scripts_changes == 'true'
    steps:
    - name: Checkout the PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Run clang-tidy on the changed lines
      uses: ZedThree/clang-tidy-review@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1
      id: review
      with:
        config_file: src/.clang-tidy
        exclude: "extern/turbulence/*"
        build_dir: build
        apt_packages: libopenmpi-dev,libhdf5-mpi-dev,python3-dev,python3-numpy,python3-matplotlib
        install_commands: >
          git config --global --add safe.directory "$GITHUB_WORKSPACE" &&
          git config --global --add safe.directory "$GITHUB_WORKSPACE/extern/amrex"
        cmake_command: cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DQUOKKA_PYTHON=ON -DQUOKKA_OPENPMD=ON -DopenPMD_USE_ADIOS2=OFF -DAMReX_SPACEDIM=3
        split_workflow: true

    # split_workflow makes the action write its warnings to clang-tidy-review-output.json instead of posting them,
    # since a PR from a fork has no permission to post. Annotations need no permission, so they work for every PR.
    # GitHub shows at most 10 annotations per step, so the job summary lists every warning.
    - name: Report the warnings and fail
      if: steps.review.outputs.total_comments > 0
      run: |
        jq -r '
          def escape_data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def escape_property: escape_data | gsub(":"; "%3A") | gsub(","; "%2C");
          .comments[]
          | "::warning file=\(.path | escape_property),line=\(.start_line // .line),endLine=\(.line)::\(.body | split("\n")[0] | escape_data)"
        ' clang-tidy-review-output.json
        {
          echo "### clang-tidy warnings on the changed lines"
          echo
          jq -r '.comments[] | "- `\(.path):\(.line)`: \(.body | split("\n")[0])"' clang-tidy-review-output.json
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

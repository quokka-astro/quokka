# Sets the scope and size labels when a PR is opened, reopened or marked ready for review, and on every push once it is out of draft.
name: "PR Dashboard: Label PR"

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    # Pushes to a draft are skipped, since marking it ready for review labels it.
    if: github.event.action != 'synchronize' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          sparse-checkout: .github/pr-dashboard
          persist-credentials: false

      - name: Set the scope and size labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: .github/pr-dashboard/src
        run: python3 -m pr_dashboard.run_dashboard label-pr --repo "$REPO" --pr "$PR_NUMBER"

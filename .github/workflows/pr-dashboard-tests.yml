# Runs the offline tests on every PR, including the check that every repository file matches a scope.
name: "PR Dashboard: Tests"

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Run the offline tests
        env:
          PYTHONPATH: .github/pr_dashboard/src
        run: python3 -m unittest discover --start-directory .github/pr_dashboard/tests --pattern "test_*.py"

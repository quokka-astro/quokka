name: 🆙 Runner image bump

# Requires the variable QUOKKA_ASTRO_APP_ID and the secret QUOKKA_ASTRO_APP_PRIVATE_KEY
# for the quokka-astro GitHub App, with contents and pull-requests write access on this repository.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: runner-image-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-ubuntu:
    if: github.repository == 'quokka-astro/quokka'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Read OS version
      id: detect
      run: |
        . /etc/os-release
        echo "version=${VERSION_ID}" >> "$GITHUB_OUTPUT"

  detect-macos:
    if: github.repository == 'quokka-astro/quokka'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Read OS version
      id: detect
      run: echo "version=$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"

  open-pr:
    needs: [detect-ubuntu, detect-macos]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      with:
        persist-credentials: false

    - name: Rewrite runner labels
      id: bump
      env:
        UBUNTU_VERSION: ${{ needs.detect-ubuntu.outputs.version }}
        MACOS_VERSION: ${{ needs.detect-macos.outputs.version }}
      run: |
        python3 scripts/python/bump_runner_images.py \
          --ubuntu-version "${UBUNTU_VERSION}" \
          --macos-version "${MACOS_VERSION}" \
          | tee "${RUNNER_TEMP}/changes.txt"
        if git diff --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
        echo "branch=ci/runner-images-ubuntu-${UBUNTU_VERSION}-macos-${MACOS_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Create app token
      id: app-token
      if: steps.bump.outputs.changed == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ vars.QUOKKA_ASTRO_APP_ID }}
        private-key: ${{ secrets.QUOKKA_ASTRO_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    - name: Open pull request
      if: steps.bump.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        BRANCH: ${{ steps.bump.outputs.branch }}
        UBUNTU_VERSION: ${{ needs.detect-ubuntu.outputs.version }}
        MACOS_VERSION: ${{ needs.detect-macos.outputs.version }}
      run: |
        remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git ls-remote --exit-code --heads "${remote_url}" "${BRANCH}" > /dev/null; then
          echo "${BRANCH} already exists; nothing to do"
          exit 0
        fi
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
        git switch -c "${BRANCH}"
        git commit -am "Update CI runner images to ubuntu-${UBUNTU_VERSION} and macos-${MACOS_VERSION}"
        git push "${remote_url}" "${BRANCH}"
        {
          echo "### Description"
          echo
          echo "The runner image behind \`ubuntu-latest\` is now ${UBUNTU_VERSION} and behind \`macos-latest\` is ${MACOS_VERSION}. This PR raises the pinned \`runs-on\` labels to match:"
          echo
          echo '```'
          cat "${RUNNER_TEMP}/changes.txt"
          echo '```'
          echo
          echo "CI on this PR is the first run on the new images. Push any fixes it needs to this branch; merge once green."
        } > "${RUNNER_TEMP}/body.md"
        gh pr create \
          --base development \
          --head "${BRANCH}" \
          --title "Update CI runner images: ubuntu-${UBUNTU_VERSION} and macos-${MACOS_VERSION}" \
          --body-file "${RUNNER_TEMP}/body.md"

name: CheckpointRestartRefine

on:
  push:
    branches: [ development ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ development ]
  merge_group:
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-final-checkpoint-restart-refine
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/checkpoint-restart-refine.yml'

  test:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    env:


    steps:
    - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        submodules: true

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install gcc-11 g++-11 python3-dev python3-numpy python3-matplotlib python3-pip libopenmpi-dev libhdf5-mpi-dev fastbuild







    - name: Build PlotfileTools
      shell: bash
      working-directory: ${{github.workspace}}/extern/amrex/Tools/Plotfile
      run: make -j4 CC="gcc-11" CXX="g++-11"

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake -G "FASTBuild" $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11 -DAMReX_SPACEDIM=3

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE --parallel 4 --target HydroBlast3D

    - name: Checkpoint/Restart with Refinement Test
      working-directory: ${{github.workspace}}/tests
      shell: bash
      env:
        BUILD_DIR: ${{runner.workspace}}/build
        PLOTFILETOOLS_DIR: ${{github.workspace}}/extern/amrex/Tools/Plotfile
      run: ../inputs/checkpoint_restart_refine_test.sh



    - name: Upload output
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: checkpoint-restart-results
        path: ${{github.workspace}}/tests

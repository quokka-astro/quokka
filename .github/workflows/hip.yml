name: hip

on:
  push:
    branches: [ development ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ development ]
  merge_group:
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-hip
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/hip.yml'

  tests-hip:
    name: HIP ROCm C++17
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        submodules: true
    - name: AMReX Dependencies
      run: |
        .github/workflows/dependencies/dependencies_hip.sh
    - name: Python and HDF5 dependencies
      run: |
        sudo apt-get update && sudo apt-get install python3-dev python3-numpy python3-matplotlib python3-pip libhdf5-mpi-dev
        .github/workflows/dependencies/dependencies_cmake.sh
        .github/workflows/dependencies/dependencies_fastbuild.sh

    - name: Build & Install
      run: |


        source /etc/profile.d/rocm.sh
        hipcc --version
        which clang
        which clang++
        which flang

        # "mpic++ --showme" forgets open-pal in Ubuntu 20.04 + OpenMPI 4.0.3
        #   https://bugs.launchpad.net/ubuntu/+source/openmpi/+bug/1941786
        #   https://github.com/open-mpi/ompi/issues/9317
        export LDFLAGS="-lopen-pal"

        cmake -S . -B build                               \
            -G "FASTBuild"                              \
            -DCMAKE_VERBOSE_MAKEFILE=ON                   \
            -DAMReX_GPU_BACKEND=HIP                       \
            -DAMReX_AMD_ARCH=gfx908                       \
            -DAMReX_ROCTX=ON                              \
            -DCMAKE_C_COMPILER=$(which clang)             \
            -DCMAKE_CXX_COMPILER=$(which clang++)         \
            -DCMAKE_CXX_STANDARD=17                       \
            -DCMAKE_CXX_FLAGS="-ffp-exception-behavior=strict -stdlib=libc++"
        cmake --build build -j 2



name: 🤖 Claude Code Review

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

  # Trigger on specific comment containing '/claude-review'
  issue_comment:
    types: [created]

  # Trigger when 'review-requested' label is added to PR
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    # Only run if:
    # 1. Manual trigger, OR
    # 2. Comment contains '/claude-review', OR
    # 3. Label 'review-requested' was added
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'review-requested')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Test coverage

            Be constructive and helpful in your feedback.

          use_sticky_comment: true

          claude_args: |
            --model claude-opus-4-7
            --max-turns 30

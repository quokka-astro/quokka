name: Fabro Code Review

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

  # Trigger on specific comment containing '/claude-review'
  issue_comment:
    types: [created]

  # Trigger when 'review-requested' label is added to PR
  pull_request:
    types: [labeled]

jobs:
  fabro-review:
    # Only run if:
    # 1. Manual trigger, OR
    # 2. Comment contains '/claude-review', OR
    # 3. Label 'review-requested' was added
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude-review')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'review-requested')

    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            workflow_dispatch)
              pr_number='${{ github.event.inputs.pr_number }}'
              ;;
            issue_comment)
              pr_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              ;;
            pull_request)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac

          if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
            echo "Could not determine pull request number." >&2
            exit 1
          fi

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Collect PR diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .workflow
          gh pr diff "${{ steps.pr.outputs.pr_number }}" --repo "${GITHUB_REPOSITORY}" > .workflow/pr.diff

      - name: Install Fabro
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://fabro.sh/install.sh | bash
          echo "$HOME/.fabro/bin" >> "$GITHUB_PATH"

      - name: Run Fabro code review
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FABRO_NO_UPGRADE_CHECK: "1"
        run: |
          set -euo pipefail
          fabro run .fabro/workflows/quokka-pr-review/workflow.toml

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabro-review
          path: .workflow/review.md
          if-no-files-found: error

  post-review:
    needs: fabro-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Download review artifact
        uses: actions/download-artifact@v5
        with:
          name: fabro-review

      - name: Post Fabro review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.fabro-review.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file review.md

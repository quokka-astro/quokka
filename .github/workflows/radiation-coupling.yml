name: Radiation coupling accuracy
on:
  pull_request:
    paths:
      - 'src/radiation/nested/**'
      - 'tests/radiation_coupling/**'
      - '.github/workflows/radiation-coupling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Prepare offline reference dependencies
        run: |
          python3 -m venv build/reference-env
          build/reference-env/bin/pip install mpmath==1.3.0
      - name: Build double-precision solver tests
        run: |
          cmake -S tests/radiation_coupling -B build/coupling-kernel -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/build/reference-env/bin/python"
          cmake --build build/coupling-kernel --parallel 2
      - name: Run accuracy and failure-path tests
        run: ctest --test-dir build/coupling-kernel --output-on-failure

name: 🧹 clang-tidy-review

# You can be more specific, but it currently only works on pull requests
# Fiewer paths are ignored because some folders (e.g. scripts) are not relavent to code build but should be linted
on:  
  pull_request:  

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-clang-tidy
  cancel-in-progress: true

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/clang-tidy.yml'

  build:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true' || needs.check_changes.outputs.has_scripts_changes == 'true'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - uses: ZedThree/clang-tidy-review@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1
      id: review
      with:
        config_file: src/.clang-tidy
        # clang-tidy lints each changed header on its own, with the compile command of a nearby source file, so a header
        # that only compiles inside a particular problem's build fails. Skipped:
        # - Chemistry.hpp and photochemistry.hpp include the EOS backend's actual_eos_data.H, which only the chemistry
        #   problems' include paths find, until the EOS is ported
        # The vendored copies in extern/ are skipped too: fixes belong upstream. So is the primordial_chem network, whose
        # right-hand side and Jacobian are generated (pynucastro).
        exclude: "extern/turbulence/*,\
          extern/gcem/*,\
          extern/eos/EOS/*,\
          extern/eos/interfaces/*,\
          src/networks/primordial_chem/network.hpp,\
          src/chemistry/Chemistry.hpp,\
          src/radiation/photochemistry.hpp"
        build_dir: build
        apt_packages: libopenmpi-dev,libhdf5-mpi-dev,python3-dev,python3-numpy,python3-matplotlib
        install_commands: >
          git config --global --add safe.directory "$GITHUB_WORKSPACE" &&
          git config --global --add safe.directory "$GITHUB_WORKSPACE/extern/amrex"
        cmake_command: cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DQUOKKA_PYTHON=ON -DQUOKKA_OPENPMD=ON -DopenPMD_USE_ADIOS2=OFF -DAMReX_SPACEDIM=3
        split_workflow: true

    # Uploads an artefact containing clang_fixes.json
    - uses: ZedThree/clang-tidy-review/upload@438014136def4cb6242e9d0ef3da1a1cd48fa7ce # v0.23.1

    # If there are any comments, fail the check
    - if: steps.review.outputs.total_comments > 0
      run: exit 1

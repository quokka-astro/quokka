name: 🧹 clang-tidy-review

# You can be more specific, but it currently only works on pull requests
# Fiewer paths are ignored because some folders (e.g. scripts) are not relavent to code build but should be linted
on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-clang-tidy
  cancel-in-progress: true

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/clang-tidy.yml'

  build:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true' || needs.check_changes.outputs.has_scripts_changes == 'true'
    env:
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 10
      CCACHE_MAXSIZE: 300M
      CCACHE_EXTRAFILES: ${{ github.workspace }}/src/.clang-tidy

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy libopenmpi-dev libhdf5-mpi-dev python3-dev python3-numpy python3-matplotlib ccache

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-clang-tidy-${{ github.base_ref }}
        restore-keys: |
             ccache-${{ runner.os }}-clang-tidy-

    - name: Configure build
      run: |
        ccache -z

        cmake -S . -B build \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DQUOKKA_PYTHON=ON \
          -DQUOKKA_OPENPMD=ON \
          -DopenPMD_USE_ADIOS2=OFF \
          -DAMReX_SPACEDIM=3 \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build to warm ccache
      run: cmake --build build -j 4

    - name: Compute changed files
      id: changed-files
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
        git diff --name-only --diff-filter=ACMRT origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
        git diff -U0 --diff-filter=ACMRT origin/${{ github.event.pull_request.base.ref }}...HEAD > diff.patch
        awk '/\\.(cpp|cc|c|cxx|hpp|h|hh|hxx|cu|cuh)$/{print}' changed-files.txt > filtered-changed-files.txt
        if [ -s filtered-changed-files.txt ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Resolve clang-tidy targets
      id: targets
      if: steps.changed-files.outputs.has_changes == 'true'
      run: |
        python3 .github/workflows/scripts/collect_clang_tidy_targets.py \
          --changed-files filtered-changed-files.txt \
          --compile-commands build/compile_commands.json \
          --repo-root "${GITHUB_WORKSPACE}" \
          --output clang-tidy-targets.txt
        if [ -s clang-tidy-targets.txt ]; then
          echo "has_targets=true" >> $GITHUB_OUTPUT
        else
          echo "has_targets=false" >> $GITHUB_OUTPUT
        fi

    - name: Run clang-tidy on changed files
      id: clang-tidy
      if: steps.targets.outputs.has_targets == 'true'
      continue-on-error: true
      run: |
        python3 .github/workflows/scripts/run_clang_tidy_and_sarif.py \
          --file-list clang-tidy-targets.txt \
          --build-dir build \
          --config-file "${GITHUB_WORKSPACE}/src/.clang-tidy" \
          --repo-root "${GITHUB_WORKSPACE}" \
          --diff-file diff.patch \
          --sarif-output clang-tidy-results.sarif \
          --log-output clang-tidy.log \
          --flag-output clang-tidy.has_diagnostics
        echo "has_diagnostics=$(cat clang-tidy.has_diagnostics)" >> $GITHUB_OUTPUT

    - name: Upload clang-tidy SARIF artifact
      if: always() && steps.targets.outputs.has_targets == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-sarif
        path: clang-tidy-results.sarif
        if-no-files-found: warn

    - name: Upload SARIF
      if: always() && steps.targets.outputs.has_targets == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: clang-tidy-results.sarif

    - name: Fail on clang-tidy diagnostics
      if: steps.targets.outputs.has_targets == 'true' && steps.clang-tidy.outputs.has_diagnostics == 'true'
      run: exit 1

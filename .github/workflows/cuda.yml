name: cuda

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-cuda
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/cuda.yml'

  tests-cuda12:
    name: CUDA@12.6 C++20 Release [build]
    runs-on: ubuntu-24.04
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    env:
      CCACHE_COMPRESS: '1'
      CCACHE_COMPRESSLEVEL: '10'
      CCACHE_MAXSIZE: 235M
    steps:
    - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Dependencies
      run: |
        extern/amrex/.github/workflows/dependencies/dependencies_nvcc.sh 12.6
        .github/workflows/dependencies/dependencies_ccache.sh

    - name: Python Dependencies
      run: python3 -m pip install --user cxxfilt

    - name: Set Up Cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Build
      env:
        CXXFLAGS: "-Werror -Wall -Wextra -Wpedantic -Wshadow"
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=235M
        ccache -z

        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        which nvcc || echo "nvcc not in PATH!"

        cmake -S . -B build                              \
            -DCMAKE_VERBOSE_MAKEFILE=ON                  \
            -DCMAKE_BUILD_TYPE=Release                   \
            -DAMReX_SPACEDIM=3                           \
            -DAMReX_GPU_BACKEND=CUDA                     \
            -DCMAKE_C_COMPILER=$(which gcc)              \
            -DCMAKE_CXX_COMPILER=$(which g++)            \
            -DCMAKE_CUDA_HOST_COMPILER=$(which g++)      \
            -DAMReX_CUDA_ARCH="7.0"                      \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache         \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

        cmake --build build -j 4

        ccache -s
        du -hs ~/.cache/ccache

    - name: CUDA Register Usage Report
      run: |
        set -euo pipefail
        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}

        mapfile -t executables < <(find build/src -type f -executable -name "test*" | sort)
        if [ "${#executables[@]}" -eq 0 ]; then
          echo "No CUDA test executables found for cuobjdump analysis."
          : > cuobjdump.txt
          echo "No CUDA kernels were built, so register usage cannot be reported." | tee register_report.txt
          exit 0
        fi

        cuobjdump --version
        cuobjdump --show-resource-usage "${executables[@]}" > cuobjdump.txt

        python3 scripts/parse_cuobjdump.py cuobjdump.txt | tee register_report.txt

    - name: Upload Register Usage Artifacts
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: cuda-register-usage
        path: |
          cuobjdump.txt
          register_report.txt

    - name: Comment Register Usage Summary
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        {
          echo "## CUDA Register Usage Summary"
          echo
          echo '```text'
          cat register_report.txt
          echo '```'
        } > register_comment.md
        gh pr comment $PR_NUMBER -F register_comment.md

name: 🎮 cuda

on:
  push:
    branches: [ development ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ development ]
  merge_group:
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-cuda
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/cuda.yml'

  tests-cuda12:
    name: CUDA@13.0 C++20 Release [build]
    runs-on: ubuntu-24.04
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    env:
      CCACHE_COMPRESS: '1'
      CCACHE_COMPRESSLEVEL: '10'
      CCACHE_MAXSIZE: 235M
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Dependencies
      run: |
        extern/amrex/.github/workflows/dependencies/dependencies_nvcc.sh 13.0
        .github/workflows/dependencies/dependencies_ccache.sh
        sudo apt-get update && sudo apt-get install libhdf5-mpi-dev

    - name: Python Dependencies
      run: python3 -m pip install --user cxxfilt

    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Build
      env:
        CXXFLAGS: "-Werror -Wall -Wextra -Wpedantic -Wshadow"
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=235M
        ccache -z

        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        which nvcc || echo "nvcc not in PATH!"

        cmake -S . -B build                              \
            -DCMAKE_VERBOSE_MAKEFILE=ON                  \
            -DCMAKE_BUILD_TYPE=Release                   \
            -DAMReX_SPACEDIM=3                           \
            -DAMReX_GPU_BACKEND=CUDA                     \
            -DCMAKE_C_COMPILER=$(which gcc)              \
            -DCMAKE_CXX_COMPILER=$(which g++)            \
            -DCMAKE_CUDA_HOST_COMPILER=$(which g++)      \
            -DAMReX_CUDA_ARCH="9.0"                      \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache         \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache	 \
            -DQUOKKA_PYTHON=OFF
        cmake --build build -j 4

        ccache -s
        du -hs ~/.cache/ccache



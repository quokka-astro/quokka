name: 🎮 cuda

on:
  push:
    branches: [ development ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ development ]
  merge_group:
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-cuda
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/cuda.yml'

  tests-cuda12:
    # The required status check is named after this job; keep the name when changing it.
    # A front-end check: nvcc parses and generates PTX for every translation unit with the
    # build's own flags, but nothing is assembled (ptxas) or linked. See
    # scripts/nvcc_ptx_check.py.
    name: CUDA@13.0 C++20 Release [build]
    runs-on: ubuntu-24.04
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0

    - name: Dependencies
      run: |
        extern/amrex/.github/workflows/dependencies/dependencies_nvcc.sh 13.0
        sudo apt-get update && sudo apt-get install libhdf5-mpi-dev

    - name: Python Dependencies
      run: python3 -m pip install --user cxxfilt

    - name: Configure
      env:
        CXXFLAGS: "-Werror -Wall -Wextra -Wpedantic -Wshadow"
      run: |
        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        which nvcc || echo "nvcc not in PATH!"

        cmake -S . -B build                              \
            -DCMAKE_BUILD_TYPE=Release                   \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON           \
            -DAMReX_SPACEDIM=3                           \
            -DAMReX_GPU_BACKEND=CUDA                     \
            -DCMAKE_C_COMPILER=$(which gcc)              \
            -DCMAKE_CXX_COMPILER=$(which g++)            \
            -DCMAKE_CUDA_HOST_COMPILER=$(which g++)      \
            -DAMReX_CUDA_ARCH="9.0"                      \
            -DQUOKKA_PYTHON=OFF

    - name: nvcc front-end check
      run: |
        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        python3 scripts/nvcc_ptx_check.py build -j $(nproc)

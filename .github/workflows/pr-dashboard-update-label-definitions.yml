# Creates and updates the label names, colours and descriptions on GitHub when labels.toml changes.
name: "PR Dashboard: Update Label Definitions"

on:
  push:
    branches:
      - development
    paths:
      - .github/pr_dashboard/labels.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          sparse-checkout: .github/pr_dashboard
          persist-credentials: false

      - name: Create and update the repository's labels from labels.toml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYTHONPATH: .github/pr_dashboard/src
        run: python3 -m pr_dashboard.run_dashboard update-label-definitions --repo "$REPO"

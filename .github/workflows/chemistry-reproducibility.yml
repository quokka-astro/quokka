name: 🧪 ChemistryReproducibility

# Runs every chemistry and photochemistry test problem for 10 timesteps and checks
# that the plotfiles are bitwise identical to the references in
# extern/chemistry_reproducibility/ (see the README there).
#
# A push to ci/chem-repro-generate makes new references instead: it fingerprints
# the source tree of the pushed commit and uploads the result as an artifact, to be
# committed into extern/chemistry_reproducibility/. Both modes share every build
# step, so the references come from exactly the toolchain the check uses.

on:
  push:
    branches: [ development, ci/chem-repro-generate ]
  # PRs into any branch, so that PRs stacked on other feature branches are checked too.
  pull_request:
  merge_group:
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-chemistry-reproducibility
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/chemistry-reproducibility.yml'
      additional_workflow_paths: '["extern/chemistry_reproducibility/**", "scripts/python/plotfile_hashes.py"]'

  test:
    # Pinned rather than ubuntu-latest: a new image can change the compiler or libc,
    # and with them the last bits of the results.
    runs-on: ubuntu-24.04
    needs: check_changes
    if: ${{ !cancelled() && (needs.check_changes.outputs.has_non_docs_changes == 'true' || github.ref == 'refs/heads/ci/chem-repro-generate') }}
    timeout-minutes: 180
    env:
      CCACHE_COMPRESS: '1'
      CCACHE_COMPRESSLEVEL: '10'
      CCACHE_MAXSIZE: 450M
      MODE: ${{ github.ref == 'refs/heads/ci/chem-repro-generate' && 'generate' || 'check' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      with:
        submodules: true
        fetch-depth: 2

    # The references must describe the source they claim to, so the generate commit
    # may add only the reproducibility CI files on top of its parent.
    - name: Check the generate commit
      if: env.MODE == 'generate'
      shell: bash
      run: |
        changed="$(git diff --name-only HEAD^ HEAD)"
        echo "Files changed relative to $(git rev-parse HEAD^):"
        echo "$changed"
        if echo "$changed" | grep -v -E '^(\.github/workflows/chemistry-reproducibility\.yml|scripts/bash/chemistry_reproducibility_test\.sh|scripts/python/plotfile_hashes\.py|extern/chemistry_reproducibility/.*)$'; then
          echo "The files above are not reproducibility CI files. Push a commit that adds only those files on top of the source to fingerprint."
          exit 1
        fi

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake ccache gcc-13 g++-13 python3-dev python3-venv python3-numpy python3-matplotlib python3-h5py python3-pip libopenmpi-dev libhdf5-mpi-dev

    - name: Install ccache
      run: .github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Initialize ccache
      run: |
        ccache --version
        ccache -z

    - name: Configure CMake
      shell: bash
      run: cmake -S $GITHUB_WORKSPACE -B ${{runner.workspace}}/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAMReX_SPACEDIM=3

    - name: Build
      shell: bash
      run: |
        targets=()
        while IFS= read -r target; do
          targets+=(--target "$target")
        done < <(scripts/bash/chemistry_reproducibility_test.sh --list-targets)
        cmake --build ${{runner.workspace}}/build --config $BUILD_TYPE --parallel 4 "${targets[@]}"

    - name: Reproducibility test
      shell: bash
      run: |
        args=(--build-dir ${{runner.workspace}}/build)
        if [ "$MODE" = generate ]; then
          args+=(--generate)
        fi
        scripts/bash/chemistry_reproducibility_test.sh "${args[@]}"

    - name: ccache stats
      if: always()
      run: |
        ccache -s
        du -hs ~/.cache/ccache

    - name: Upload references
      if: always() && env.MODE == 'generate'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chemistry-reproducibility-references
        path: ${{github.workspace}}/extern/chemistry_reproducibility

    - name: Upload logs and fingerprints
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chemistry-reproducibility-runs
        path: |
          ${{github.workspace}}/tests/chemistry_reproducibility/**/log.txt
          ${{github.workspace}}/tests/chemistry_reproducibility/**/fingerprint.txt

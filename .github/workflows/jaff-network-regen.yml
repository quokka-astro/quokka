name: 🧪 jaff network regeneration

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  regen-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install clang-format
        run: pipx install "clang-format==22.1.8"

      - name: Regenerate photoionization_H_caseB network
        run: |
          set -euo pipefail
          git rm -r -f --ignore-unmatch --quiet -- src/networks/photoionization_H_caseB
          git clean -fdx -- src/networks/photoionization_H_caseB
          mkdir -p src/networks/photoionization_H_caseB
          src/networks/photoionization_H_caseB_config/regenerate.sh

      - name: Fail if regeneration produced a diff
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all -- src/networks/photoionization_H_caseB)" ]]; then
            git status --porcelain --untracked-files=all -- src/networks/photoionization_H_caseB
            echo "::error::Regenerating the photoionization_H_caseB network produced a diff." \
                 "The committed network is out of sync with src/networks/photoionization_H_caseB_config/." \
                 "Re-run regenerate.sh and commit the result, or check for hand-edits to generated files."
            exit 1
          fi

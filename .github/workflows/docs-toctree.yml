name: 📚 mdBook validation

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  docs-toctree:
    name: Validate mdBook summary and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - name: Install mdBook tooling
        run: |
          cargo install mdbook --version 0.5.2 --locked
          cargo install mdbook-bib --version 0.5.2 --locked
      - name: Check for unreachable Markdown pages
        run: python scripts/check_mdbook_summary.py
      - name: Build mdBook documentation
        run: ./scripts/bash/docs_build.sh

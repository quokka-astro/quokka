name: 📚 mdBook validation

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  docs-toctree:
    name: Validate mdBook summary and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rustc cargo
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - name: Install mdBook tooling
        run: ./scripts/bash/install_mdbook.sh
      - name: Check for unreachable Markdown pages
        run: python scripts/check_mdbook_summary.py
      - name: Build mdBook documentation
        run: ./scripts/bash/docs_build.sh

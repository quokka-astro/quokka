name: CMake (macOS)

on:
  push:
    branches: [ development ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ development ]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-cmake-macos
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml
    with:
      workflow_file: '.github/workflows/cmake-macos.yml'

  build:
    runs-on: macos-14
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'

    steps:
    - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        submodules: true
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of sonarcloud analysis
    
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip' # caching pip dependencies

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Install Homebrew dependencies
      run: |
        brew install openmpi hdf5@1.10 || true
        brew link --force hdf5@1.10

    - name: Output HDF5 configuration (verbose)
      run: h5cc -showconfig

    - name: Output HDF5 compile flags
      run: h5cc -show

    - name: Install pip dependencies
      run: python3 -m pip install --user numpy matplotlib

    - name: Install Canary
      run: python3 -m pip install --user "canary-wm @ git+https://github.com/sandialabs/canary"

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      env: {CXXFLAGS: "-ffp-exception-behavior=strict"}
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE --parallel 3

    - name: Create test output directory
      run: cmake -E make_directory $GITHUB_WORKSPACE/tests

    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        export PATH="$HOME/Library/Python/3.11/bin:$PATH"
        canary run --output-on-failure --workers=3 .

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: ${{github.workspace}}/tests

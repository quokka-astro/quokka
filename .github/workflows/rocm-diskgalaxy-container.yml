name: rocm-diskgalaxy-container

"on":
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

concurrency:
  group: rocm-diskgalaxy-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE: ghcr.io/quokka-astro/quokka-linux-amd64-rocm:development

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DiskGalaxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/dockerfiles/ROCm-DiskGalaxy/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm-diskgalaxy
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rocm-diskgalaxy-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

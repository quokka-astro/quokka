name: 🐚 shellcheck

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run shellcheck
        run: |
          mapfile -t files < <(
            rg --files \
              -g '*.sh' \
              -g '*.submit' \
              -g '*.pbs' \
              -g '*.profile' \
              scripts \
              .github/workflows \
            | while IFS= read -r file; do
                if head -n 1 "$file" | grep -Eq '^#!([[:space:]]*/usr/bin/env[[:space:]]+)?(bash|sh)$|^#![[:space:]]*/bin/(bash|sh)$'; then
                  printf '%s\n' "$file"
                fi
              done
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          shellcheck --severity=error "${files[@]}"

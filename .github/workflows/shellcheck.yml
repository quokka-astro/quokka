name: 🐚 shellcheck

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run shellcheck
        shell: bash
        run: |
          set -euo pipefail

          tracked_files="$(git ls-files -- scripts .github/workflows)"
          files=()
          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi

            if [[ "$file" != *.sh && "$file" != *.submit && "$file" != *.pbs && "$file" != *.profile ]]; then
              continue
            fi

            first_line="$(head -n 1 "$file")"
            if printf '%s\n' "$first_line" | grep -Eq '^#!([[:space:]]*/usr/bin/env[[:space:]]+)?(bash|sh)$|^#![[:space:]]*/bin/(bash|sh)$'; then
              files+=("$file")
            fi
          done <<< "$tracked_files"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          shellcheck --severity=error "${files[@]}"

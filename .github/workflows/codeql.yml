name: CodeQL

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  schedule:
    - cron: "27 3 * * 0"

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-codeql
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_changes:
    if: ${{ github.repository == 'quokka-astro/quokka' || github.event_name != 'schedule' }}
    uses: ./.github/workflows/check_changes.yml

  analyze:
    if: ${{ github.repository == 'quokka-astro/quokka' || github.event_name != 'schedule' }}
    name: Analyze
    runs-on: ubuntu-latest
    needs: check_changes
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python, cpp ]

    steps:
      - name: Check if analysis needed
        id: check_analysis
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ needs.check_changes.outputs.has_cpp_changes }}" == "true" ]] || [[ "${{ needs.check_changes.outputs.has_py_changes }}" == "true" ]]; then
            echo "should_analyze=true" >> $GITHUB_OUTPUT
            echo "Analysis needed for ${{ matrix.language }}"
          else
            echo "should_analyze=false" >> $GITHUB_OUTPUT
            echo "No relevant changes - skipping ${{ matrix.language }} analysis"
          fi

      - name: Checkout
        if: steps.check_analysis.outputs.should_analyze == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Packages (C++)
        if: ${{ matrix.language == 'cpp' && steps.check_analysis.outputs.should_analyze == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake openmpi-bin libopenmpi-dev libhdf5-openmpi-dev
          .github/workflows/dependencies/dependencies_ccache.sh
          sudo ln -s /usr/local/bin/ccache /usr/local/bin/g++

      - name: Set Up Cache
        if: ${{ matrix.language == 'cpp' && steps.check_analysis.outputs.should_analyze == 'true' }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
          restore-keys: |
               ccache-${{ github.workflow }}-${{ github.job }}-git-

      - name: Configure (C++)
        if: ${{ matrix.language == 'cpp' && steps.check_analysis.outputs.should_analyze == 'true' }}
        run: |
          cmake -S . -B build                            \
              -DAMReX_SPACEDIM=3                         \
              -DQUOKKA_PYTHON=OFF                        \
              -DCMAKE_VERBOSE_MAKEFILE=ON                \
              -DCMAKE_CXX_COMPILER="/usr/local/bin/g++"

      - name: Initialize CodeQL
        if: steps.check_analysis.outputs.should_analyze == 'true'
        uses: github/codeql-action/init@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config-file: ./.github/workflows/codeql/codeql-config.yml

      - name: Build (py)
        if: ${{ matrix.language == 'python' && steps.check_analysis.outputs.should_analyze == 'true' }}
        uses: github/codeql-action/autobuild@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0

      - name: Build (C++)
        if: ${{ matrix.language == 'cpp' && steps.check_analysis.outputs.should_analyze == 'true' }}
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=10
          export CCACHE_MAXSIZE=30M
          ccache -z

          cmake --build build -j 4

          ccache -s
          du -hs ~/.cache/ccache

          # Make sure CodeQL has something to do
          touch src/main.cpp
          export CCACHE_DISABLE=1
          cd build
          make -j 4

      - name: Perform CodeQL Analysis
        if: steps.check_analysis.outputs.should_analyze == 'true'
        uses: github/codeql-action/analyze@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: "/language:${{ matrix.language }}"

  save_pr_number:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo $PR_NUMBER > pr_number.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr_number
          path: pr_number.txt
          retention-days: 1

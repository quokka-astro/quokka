##
## === SIZE LABELS
##

## set from the lines changed (additions plus deletions): a PR gets the largest
## `min_num_lines` it reaches

[size]
prefix = "size/"

[[size.label]]
value = "XS"
color = "EAEEF2"
description = "This PR changes 0 to 9 lines"
min_num_lines = 0

[[size.label]]
value = "S"
color = "D0D7DE"
description = "This PR changes 10 to 29 lines"
min_num_lines = 10

[[size.label]]
value = "M"
color = "AFB8C1"
description = "This PR changes 30 to 99 lines"
min_num_lines = 30

[[size.label]]
value = "L"
color = "6E7781"
description = "This PR changes 100 to 499 lines"
min_num_lines = 100

[[size.label]]
value = "XL"
color = "D73A4A"
description = "This PR changes 500 or more lines"
min_num_lines = 500

##
## === PRIORITY LABELS
##

## set by people with /set-priority, using the value, e.g. `/set-priority high`
## a PR with no priority label has the default priority; `/set-priority <default_value>` removes the label

[priority]
prefix = "priority/"
default_value = "normal"

[[priority.label]]
value = "low"
color = "FDDCB5"
description = "Review when there is time"

[[priority.label]]
value = "high"
color = "E36209"
description = "Review soon"

## the labels used by the PR dashboard; labels not listed here are left alone
## each category sets a prefix, and each label's name on GitHub is the prefix plus its value
## scope/ and size/ labels are set by the tool; edits by hand are replaced

##
## === SCOPE LABELS
##

## set from the changed files: a PR gets every scope with a matching path, then keeps only those
## on the most relevant `relevance_level` it touches (1 is the most relevant); scopes on the same level all show
## a pattern's `*` also matches `/`, so `src/hydro/*` covers every file below `src/hydro/`

[scope]
prefix = "scope/"

## --- unlabelled files
## every file in the repository needs a scope below or a pattern here; files matching a pattern
## here deliberately have no scope, so they give the PR no scope label and do not count as unmapped
unlabelled_path_patterns = []

## --- unmapped files
## a changed file that matches no scope gives the PR this label, whatever the relevance levels,
## to show that its path needs adding to a scope below
[scope.not_mapped_label]
value = "undefined"
color = "D73A4A"
description = "A changed file has no scope yet; add its path to labels.toml"

## --- physics
## each module's src/ folder, its problems in src/problems/, and their files in inputs/

[[scope.label]]
value = "hydro"
color = "16A085"
description = "Hydrodynamics"
relevance_level = 1
path_patterns = [
    "src/hydro/*",
    "src/turbulence/*",
    "src/problems/Hydro*",
    "src/problems/Nscbc*",
    "inputs/Hydro*",

# Quick CI pipeline: builds and tests only the problems changed in this PR.
# Trigger manually with the PR comment: /azp run rocm-quick
# If no src/problems/ files are changed, the job skips the build with a reminder.
trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - development
  paths:
    include:
    - src/problems/**

jobs:
  - job: Quick_HIP_Build_Test
    pool: amdgpu
    timeoutInMinutes: 150
    steps:
    - checkout: self
      submodules: recursive

    - script: |
        mkdir -p "$(Agent.HomeDirectory)/cache/ccache"
        echo "Using shared local disk cache at $(Agent.HomeDirectory)/cache/ccache"
      displayName: Prepare shared ccache directory

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache

    - template: templates/ccache-prepare.yml

    - script: |
        TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's|refs/heads/||')
        [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="development"
        git fetch --deepen=100 origin "$TARGET_BRANCH"
        MERGE_BASE=$(git merge-base FETCH_HEAD HEAD)
        CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD)
        PROBLEMS=$(echo "$CHANGED" | grep '^src/problems/' | awk -F'/' '{print $3}' | sort -u | grep -v '^$')
        if [ -z "$PROBLEMS" ]; then
          echo "##[section]No src/problems/ files changed in this PR."
          echo "This pipeline only builds and tests problems modified in the PR."
          echo "To run the full test suite, use: /azp run"
          echo "##vso[task.setvariable variable=hasProblems]false"
        else
          echo "Changed problems: $(echo $PROBLEMS | tr '\n' ' ')"
          CMAKE_TARGETS=$(echo "$PROBLEMS" | awk '{printf "--target %s ", $0}' | sed 's/ $//')
          CTEST_REGEX="^($(echo "$PROBLEMS" | tr '\n' '|' | sed 's/|$//'))($|-)"
          echo "cmake targets: $CMAKE_TARGETS"
          echo "ctest regex: $CTEST_REGEX"
          echo "##vso[task.setvariable variable=hasProblems]true"
          echo "##vso[task.setvariable variable=cmakeTargetArgs]$CMAKE_TARGETS"
          echo "##vso[task.setvariable variable=ctestRegex]$CTEST_REGEX"
        fi
      displayName: 'Detect changed problems'

    - task: CMake@1
      displayName: 'Configure CMake'
      condition: eq(variables['hasProblems'], 'true')
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '.. -DCMAKE_BUILD_TYPE=Release -DAMReX_SPACEDIM=3 -DAMReX_GPU_BACKEND=HIP -DCMAKE_CXX_FLAGS=-ffp-exception-behavior=strict $(cmakeLauncherArgs)'

    - task: CMake@1
      displayName: 'Build Quokka (targeted)'
      condition: eq(variables['hasProblems'], 'true')
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '--build . --parallel 16 $(cmakeTargetArgs)'

    - script: |
        echo "Searching for problems matching regex: $(ctestRegex)"
        ctest -R "$(ctestRegex)" -E "RadMatterCoupling*" -T Test --output-on-failure
      displayName: 'Run CTest (targeted)'
      condition: eq(variables['hasProblems'], 'true')
      workingDirectory: build

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/*/Test.xml
        testRunTitle: $(Agent.JobName)
      condition: and(succeededOrFailed(), eq(variables['hasProblems'], 'true'))
      displayName: Publish test results

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: build/Testing/Temporary
        ArtifactName: ctest-temporary-logs
        publishLocation: Container
      condition: and(succeededOrFailed(), eq(variables['hasProblems'], 'true'))
      displayName: Publish CTest temporary logs artifact

    - template: templates/ccache-stats.yml

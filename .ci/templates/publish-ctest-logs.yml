# Reusable template for publishing the CTest temporary logs directory.
#
# build/Testing/Temporary only exists once CTest has actually run. When the
# build/test steps are skipped (e.g. a docs-only change on a merge-queue
# branch, where the pipeline's `trigger:` block has no path filter) or when the
# build fails before CTest, PublishBuildArtifacts@1 fails the whole job with
# "Not found PathtoPublish: .../build/Testing/Temporary". Probe for the
# directory first and skip the publish when there is nothing to publish.

steps:
- script: |
    if [ -d build/Testing/Temporary ]; then
      echo "##vso[task.setvariable variable=hasCtestLogs]true"
    else
      echo "build/Testing/Temporary does not exist; nothing to publish."
      echo "##vso[task.setvariable variable=hasCtestLogs]false"
    fi
  displayName: Check for CTest temporary logs
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: build/Testing/Temporary
    ArtifactName: ctest-temporary-logs
    publishLocation: Container
  condition: and(succeededOrFailed(), eq(variables['hasCtestLogs'], 'true'))
  displayName: Publish CTest temporary logs artifact

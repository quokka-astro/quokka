# Reusable template for reporting ccache statistics
steps:
- script: |
    if command -v ccache >/dev/null 2>&1; then
      echo "=== Before cleanup ==="
      ccache --show-stats || true
      echo ""
      echo "=== Cleanup ==="
      ccache --cleanup || true
      echo ""
      echo "=== After cleanup ==="
      ccache --show-stats || true
      echo ""
      echo "=== Cache directory size ==="
      du -sh "$CCACHE_DIR" 2>/dev/null || echo "Could not measure directory size"
    else
      echo "ccache not installed; no statistics to report."
    fi
  displayName: Report ccache statistics
  condition: succeededOrFailed()
  env:
    CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache

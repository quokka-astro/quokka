# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Disable automatic CI trigger on push/merge to development branch.
# Pipeline can still be triggered manually via `/azp run` or on PR validation.
trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - development
  paths:
    include:
    - src/**
    - tests/**
    - inputs/**
    - CMakeLists.txt
    - .ci/azure-pipelines.yml
    - extern/cooling/*.h5
    - extern/amrex
    - extern/amrex/**
    - extern/Microphysics
    - extern/Microphysics/**
    - extern/fmt
    - extern/fmt/**
    - extern/yaml-cpp
    - extern/yaml-cpp/**
    - extern/openPMD-api
    - extern/openPMD-api/**
    - extern/AMReX-Hydro
    - extern/AMReX-Hydro/**
    - extern/turbulence
    - extern/turbulence/**
    exclude:
    - docs/**
    - paper/**
    - scripts/**
    - '*.md'
    - '*.rst'
    - '*.txt'


jobs:
  - job: CUDA_Build_Test
    pool: avatar
    timeoutInMinutes: 330
    steps:
    - script: |
        mkdir -p "$(Agent.HomeDirectory)/cache/ccache"
        echo "Using shared local disk cache at $(Agent.HomeDirectory)/cache/ccache"
      displayName: Prepare shared ccache directory

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache

    - template: templates/ccache-prepare.yml

    - script: |
        # Keep the job idle during the restricted window [03:30, 07:00).
        blocked_start_minutes=$((3 * 60 + 30))
        blocked_end_minutes=$((7 * 60))
        check_interval=60

        while true; do
          hour=$(date +%H)
          minute=$(date +%M)
          now_minutes=$((10#$hour * 60 + 10#$minute))

          if [ "$now_minutes" -lt "$blocked_start_minutes" ] || [ "$now_minutes" -ge "$blocked_end_minutes" ]; then
            echo "Current time $(date '+%F %T') is outside restricted window. Proceeding."
            break
          fi

          remaining_minutes=$((blocked_end_minutes - now_minutes))
          remaining_seconds=$((remaining_minutes * 60))
          echo "Current time $(date '+%F %T') is within restricted window (03:30-07:00). Remaining wait: ${remaining_minutes}m."

          if [ "$remaining_seconds" -le "$check_interval" ]; then
            sleep "$remaining_seconds"
          else
            sleep "$check_interval"
          fi
        done
      displayName: 'Wait for allowed CI start window'

    - task: CMake@1
      displayName: 'Configure CMake'
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '.. -DCMAKE_BUILD_TYPE=Release -DAMReX_SPACEDIM=3 -DAMReX_GPU_BACKEND=CUDA -DQUOKKA_PYTHON=OFF $(cmakeLauncherArgs)'
    
    - task: CMake@1
      displayName: 'Build Quokka'
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '--build . --parallel 16'
    
    - task: CMake@1
      displayName: 'Run CTest'
      inputs:
        cmakeArgs: '-E chdir . ctest -E "RadMatterCoupling*" -T Test --output-on-failure'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/*/Test.xml
        testRunTitle: $(Agent.JobName)
      condition: succeededOrFailed()
      displayName: Publish test results

    - template: templates/ccache-stats.yml

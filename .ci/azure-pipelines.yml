# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Run on merge queue branches so GitHub merge queue sees Azure checks.
trigger:
  branches:
    include:
    - gh-readonly-queue/development/*

pr:
  autoCancel: true
  branches:
    include:
    - development
  paths:
    include:
    - src/**
    - tests/**
    - inputs/**
    - CMakeLists.txt
    - .ci/azure-pipelines.yml
    - extern/cooling/*.h5
    - extern/amrex
    - extern/amrex/**
    - extern/Microphysics
    - extern/Microphysics/**
    - extern/fmt
    - extern/fmt/**
    - extern/yaml-cpp
    - extern/yaml-cpp/**
    - extern/openPMD-api
    - extern/openPMD-api/**
    - extern/AMReX-Hydro
    - extern/AMReX-Hydro/**
    - extern/turbulence
    - extern/turbulence/**
    - .gitmodules
    exclude:
    - docs/**
    - paper/**
    - scripts/**
    - '*.md'
    - '*.rst'
    - '*.txt'


jobs:
  - job: CUDA_Build_Test
    pool: avatar
    timeoutInMinutes: 360
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -euo pipefail

        git fetch origin development --depth=1
        changed_files="$(git diff --name-only FETCH_HEAD...HEAD)"

        run_heavy="false"
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            src/*|tests/*|inputs/*|CMakeLists.txt|.ci/azure-pipelines.yml|extern/cooling/*.h5|extern/amrex|extern/amrex/*|extern/Microphysics|extern/Microphysics/*|extern/fmt|extern/fmt/*|extern/yaml-cpp|extern/yaml-cpp/*|extern/openPMD-api|extern/openPMD-api/*|extern/AMReX-Hydro|extern/AMReX-Hydro/*|extern/turbulence|extern/turbulence/*|.gitmodules)
              run_heavy="true"
              break
              ;;
          esac
        done <<< "$changed_files"

        echo "RunHeavyCI=${run_heavy}"
        echo "##vso[task.setvariable variable=RunHeavyCI]${run_heavy}"
      displayName: Detect CI-relevant changes

    - script: |
        if [ "$(RunHeavyCI)" != "true" ]; then
          echo "No CI-relevant files changed; skipping CUDA build/test."
        fi
      displayName: Announce docs-only no-op
      condition: and(succeeded(), ne(variables['RunHeavyCI'], 'true'))

    - script: |
        mkdir -p "$(Agent.HomeDirectory)/cache/ccache"
        echo "Using shared local disk cache at $(Agent.HomeDirectory)/cache/ccache"
      displayName: Prepare shared ccache directory
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - template: templates/ccache-prepare.yml
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - script: |
        # Keep the job idle during the restricted window [03:30, 07:00).
        blocked_start_minutes=$((3 * 60 + 30))
        blocked_end_minutes=$((7 * 60))
        time_check_interval=600

        while true; do
          hour=$(date +%H)
          minute=$(date +%M)
          now_minutes=$((10#$hour * 60 + 10#$minute))

          if [ "$now_minutes" -lt "$blocked_start_minutes" ] || [ "$now_minutes" -ge "$blocked_end_minutes" ]; then
            echo "Current time $(date '+%F %T') is outside restricted window."
            break
          fi

          remaining_minutes=$((blocked_end_minutes - now_minutes))
          remaining_seconds=$((remaining_minutes * 60))
          echo "Current time $(date '+%F %T') is within restricted window (03:30-07:00). Remaining wait: ${remaining_minutes}m."

          if [ "$remaining_seconds" -le "$time_check_interval" ]; then
            sleep "$remaining_seconds"
          else
            sleep "$time_check_interval"
          fi
        done

        echo "Checking for conflicting jobs on the GPU..."
        gpu_check_interval=60
        waited=0
        while true; do
          # Primary: check for active CUDA processes via GPU driver (cross-container reliable)
          gpu_procs=$(nvidia-smi --query-compute-apps=pid,name --format=csv,noheader 2>/dev/null || true)
          # Secondary: check for cron regression test script (best-effort; requires shared PID namespace)
          regtest_running=0
          if pgrep -f "regtest.py" > /dev/null 2>&1; then
            regtest_running=1
          fi
          if [ -z "$gpu_procs" ] && [ "$regtest_running" -eq 0 ]; then
            if [ "$waited" -gt 0 ]; then
              echo "GPU is free and no regression test detected, proceeding..."
            else
              echo "GPU is free, proceeding..."
            fi
            break
          fi
          reasons=""
          if [ -n "$gpu_procs" ]; then
            count=$(echo "$gpu_procs" | grep -c '[0-9]' || true)
            names=$(echo "$gpu_procs" | awk -F',' '{print $2}' | tr '\n' ' ' | sed 's/ $//')
            reasons="GPU has ${count} active CUDA process(es) [${names}]"
          fi
          if [ "$regtest_running" -eq 1 ]; then
            [ -n "$reasons" ] && reasons="${reasons}; "
            reasons="${reasons}regression test (regtest.py) is running"
          fi
          echo "Waiting: ${reasons}. Rechecking in ${gpu_check_interval}s (${waited}s elapsed)..."
          sleep "$gpu_check_interval"
          waited=$((waited + gpu_check_interval))
        done
      displayName: 'Wait for allowed time and free GPU'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - task: CMake@1
      displayName: 'Configure CMake'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '.. -DCMAKE_BUILD_TYPE=Release -DAMReX_SPACEDIM=3 -DAMReX_GPU_BACKEND=CUDA -DQUOKKA_PYTHON=OFF $(cmakeLauncherArgs)'
    
    - task: CMake@1
      displayName: 'Build Quokka'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '--build . --parallel 16'
    
    - task: CMake@1
      displayName: 'Run CTest'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      inputs:
        cmakeArgs: '-E chdir . ctest -E "RadMatterCoupling*" -T Test --output-on-failure'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/*/Test.xml
        testRunTitle: $(Agent.JobName)
      condition: and(succeededOrFailed(), eq(variables['RunHeavyCI'], 'true'))
      displayName: Publish test results

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: build/Testing/Temporary
        ArtifactName: ctest-temporary-logs
        publishLocation: Container
      condition: succeededOrFailed()
      displayName: Publish CTest temporary logs artifact

    - template: templates/ccache-stats.yml
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Run on merge queue branches so GitHub merge queue sees Azure checks.
trigger:
  branches:
    include:
    - gh-readonly-queue/development/*

pr:
  autoCancel: true
  branches:
    include:
    - development
  paths:
    include:
    - src/**
    - tests/**
    - inputs/**
    - CMakeLists.txt
    - .ci/azure-pipelines-amdgpu.yml
    - extern/cooling/*.h5
    - extern/amrex
    - extern/amrex/**
    - extern/Microphysics
    - extern/Microphysics/**
    - extern/fmt
    - extern/fmt/**
    - extern/yaml-cpp
    - extern/yaml-cpp/**
    - extern/openPMD-api
    - extern/openPMD-api/**
    - extern/AMReX-Hydro
    - extern/AMReX-Hydro/**
    - extern/turbulence
    - extern/turbulence/**
    - .gitmodules
    exclude:
    - docs/**
    - paper/**
    - scripts/**
    - '*.md'
    - '*.rst'
    - '*.txt'


jobs:
  - job: HIP_Build_Test
    pool: amdgpu
    timeoutInMinutes: 150
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -euo pipefail

        TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's|refs/heads/||')
        [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="development"
        git fetch origin "$TARGET_BRANCH"
        changed_files="$(git diff --name-only FETCH_HEAD...HEAD)"

        run_heavy="false"
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            src/*|tests/*|inputs/*|CMakeLists.txt|.ci/azure-pipelines-amdgpu.yml|extern/cooling/*.h5|extern/amrex|extern/amrex/*|extern/Microphysics|extern/Microphysics/*|extern/fmt|extern/fmt/*|extern/yaml-cpp|extern/yaml-cpp/*|extern/openPMD-api|extern/openPMD-api/*|extern/AMReX-Hydro|extern/AMReX-Hydro/*|extern/turbulence|extern/turbulence/*|.gitmodules)
              run_heavy="true"
              break
              ;;
          esac
        done <<< "$changed_files"

        echo "RunHeavyCI=${run_heavy}"
        echo "##vso[task.setvariable variable=RunHeavyCI]${run_heavy}"
      displayName: Detect CI-relevant changes

    - script: |
        if [ "$(RunHeavyCI)" != "true" ]; then
          echo "No CI-relevant files changed; skipping HIP build/test."
        fi
      displayName: Announce docs-only no-op
      condition: and(succeeded(), ne(variables['RunHeavyCI'], 'true'))

    - script: |
        mkdir -p "$(Agent.HomeDirectory)/cache/ccache"
        echo "Using shared local disk cache at $(Agent.HomeDirectory)/cache/ccache"
      displayName: Prepare shared ccache directory
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - template: templates/ccache-prepare.yml
      parameters:
        stepCondition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))

    - task: CMake@1
      displayName: 'Configure CMake'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '.. -DCMAKE_BUILD_TYPE=Release -DAMReX_SPACEDIM=3 -DAMReX_GPU_BACKEND=HIP -DCMAKE_CXX_FLAGS=-ffp-exception-behavior=strict $(cmakeLauncherArgs)'
    
    - task: CMake@1
      displayName: 'Build Quokka'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '--build . --parallel 16'
    
    - task: CMake@1
      displayName: 'Run CTest'
      condition: and(succeeded(), eq(variables['RunHeavyCI'], 'true'))
      inputs:
        cmakeArgs: '-E chdir . ctest -E "RadMatterCoupling*" -T Test --output-on-failure'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/*/Test.xml
        testRunTitle: $(Agent.JobName)
      condition: and(succeededOrFailed(), eq(variables['RunHeavyCI'], 'true'))
      displayName: Publish test results

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: build/Testing/Temporary
        ArtifactName: ctest-temporary-logs
        publishLocation: Container
      condition: succeededOrFailed()
      displayName: Publish CTest temporary logs artifact

    - template: templates/ccache-stats.yml
      parameters:
        stepCondition: and(succeededOrFailed(), eq(variables['RunHeavyCI'], 'true'))

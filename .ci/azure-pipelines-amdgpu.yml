# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - development
  paths:
    include:
    - src/**
    - tests/**
    - inputs/**
    - CMakeLists.txt
    - .ci/azure-pipelines-amdgpu.yml
    - extern/cooling/*.h5
    - extern/amrex/**
    - extern/Microphysics/**
    - extern/fmt/**
    - extern/yaml-cpp/**
    - extern/openPMD-api/**
    - extern/AMReX-Hydro/**
    exclude:
    - docs/**
    - paper/**
    - scripts/**
    - '*.md'
    - '*.rst'
    - '*.txt'

pr:
  autoCancel: true
  branches:
    include:
    - development
  paths:
    include:
    - src/**
    - tests/**
    - inputs/**
    - CMakeLists.txt
    - .ci/azure-pipelines-amdgpu.yml
    - extern/cooling/*.h5
    - extern/amrex/**
    - extern/Microphysics/**
    - extern/fmt/**
    - extern/yaml-cpp/**
    - extern/openPMD-api/**
    - extern/AMReX-Hydro/**
    - extern/turbulence/**
    exclude:
    - docs/**
    - paper/**
    - scripts/**
    - '*.md'
    - '*.rst'
    - '*.txt'


jobs:
  - job: HIP_Build_Test
    pool: amdgpu
    timeoutInMinutes: 150
    steps:
    - script: |
        mkdir -p $(Pipeline.Workspace)/ccache
        echo "Using local disk cache at $(Pipeline.Workspace)/ccache"
      displayName: Prepare local ccache directory

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache

    - template: templates/ccache-prepare.yml

    - task: CMake@1
      displayName: 'Configure CMake'
      env:
        CCACHE_DIR: $(Pipeline.Workspace)/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '.. -DCMAKE_BUILD_TYPE=Release -DAMReX_SPACEDIM=3 -DAMReX_GPU_BACKEND=HIP -DCMAKE_CXX_FLAGS=-ffp-exception-behavior=strict $(cmakeLauncherArgs)'
    
    - task: CMake@1
      displayName: 'Build Quokka'
      env:
        CCACHE_DIR: $(Pipeline.Workspace)/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
      inputs:
        cmakeArgs: '--build . --parallel 16'
    
    - task: CMake@1
      displayName: 'Run CTest'
      inputs:
        cmakeArgs: '-E chdir . ctest -E "RadMatterCoupling*" -T Test --output-on-failure'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: cTest
        testResultsFiles: build/Testing/*/Test.xml
        testRunTitle: $(Agent.JobName)
      condition: succeededOrFailed()
      displayName: Publish test results

    - template: templates/ccache-stats.yml

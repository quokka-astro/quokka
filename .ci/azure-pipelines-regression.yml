# don't run on pull request or push
pr: none
trigger: none

# run on timed schedule, like a cron job
# NOTE: all times are in UTC!
schedules:
- cron: '0 14 * * *'
  displayName: Daily 1am build (AEDT)
  branches:
    include:
    - development


# NOTE: several Python packages are needed for regression_testing to run properly:
#   https://github.com/AMReX-Codes/regression_testing/blob/main/requirements.txt
# ALSO NEEDED: bokeh

jobs:
  - job: GPU_Regression
    pool: avatar
    timeoutInMinutes: 300
    steps:
    - script: |
        mkdir -p "$(Agent.HomeDirectory)/cache/ccache"
        echo "Using shared local disk cache at $(Agent.HomeDirectory)/cache/ccache"
      displayName: Prepare shared ccache directory

    - script: |
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache available on agent."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache"
        else
          echo "ccache not found; proceeding without compiler cache."
          echo "##vso[task.setvariable variable=cmakeLauncherArgs]"
        fi
      displayName: Detect ccache

    - template: templates/ccache-prepare.yml

    - script: ./extern/regression_testing/regtest.py --clean_testdir regression/quokka-tests.ini
      displayName: 'Run regression testing'
      env:
        CCACHE_DIR: $(Agent.HomeDirectory)/cache/ccache
        CCACHE_BASEDIR: $(Build.SourcesDirectory)
        CCACHE_NOHASHDIR: 1
    - publish: /priv/avatar/cche/azp-agent-in-docker-cuda/azp-agent-avatargpu/regression-tests/web
      condition: succeededOrFailed()
      artifact: regressionHTMLOutput
      displayName: 'Upload results to Azure Pipelines'
    - script: |
        set -x
        cd /priv/avatar/cche/azp-agent-in-docker-cuda/azp-agent-avatargpu/regression-tests/web
        export GIT_TERMINAL_PROMPT=0
        echo "Checking for changes in regression results..."
        git status
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit, skipping push..."
          exit 0
        fi
        echo "Committing changes..."
        git -c user.name="ChongChong He" -c user.email="chongchonghe99@gmail.com" \
            commit --no-verify -m "updated results [skip ci]"
        echo "Pushing to GitHub Pages..."
        git -c core.askPass= push origin HEAD 2>&1 || {
          echo "Push failed with exit code $?, but continuing..."
          exit 0
        }
        echo "Successfully pushed regression results"
      condition: succeededOrFailed()
      displayName: 'Upload results to GitHub Pages'
    - template: templates/ccache-stats.yml

version: 2.1

# Enable setup workflows for dynamic configuration
setup: true

# Import the path-filtering orb
orbs:
  path-filtering: circleci/path-filtering@2.0.0

workflows:
  # Setup workflow that determines which tests to run
  setup-workflow:
    jobs:
      - path-filtering/filter:
          # Define mapping of path patterns to pipeline parameters
          mapping: |
            src/.* run-tests true
            tests/.* run-tests true
            CMakeLists.txt run-tests true
            **/*.cpp run-tests true
            **/*.c run-tests true
            **/*.hpp run-tests true
            **/*.h run-tests true
          # Base revision for comparison
          base-revision: development
          # Config to use for the development pipeline
          config-path: .circleci/continue-config.yml

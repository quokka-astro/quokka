# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo     =  [0.0, 0.0, 0.0]
geometry.prob_hi     =  [1.596e19, 1.596e19, 1.596e19]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [64, 64, 64]
amr.max_level       = 0     # number of levels = max_level + 1
amr.blocking_factor = 32  # grid size must be divisible by this
amr.max_grid_size = 128  # at least 128 for GPUs
do_reflux = 0
do_subcycle = 0
suppress_output = 0

stop_time = 2.9e12 # = 3 t_s

stromgen.primary_species_1 = 1.0e-10
stromgen.primary_species_2 = 139.9
stromgen.primary_species_3 = 1.0e-10
stromgen.Q = 4e46
stromgen.temperature = 37.11

photochemistry.enabled = 1
integrator.use_number_densities = 1
integrator.do_species_clip = 0
integrator.jacobian = 1
integrator.renormalize_abundances = 0
integrator.subtract_internal_energy = 0
integrator.X_reject_buffer = 1e100
integrator.ode_max_steps = 50000

plotfile_interval = -1
plotfile_prefix = "DType"

network.allow_mixed_cell_cooling = 0


max_timesteps = 1000000  # stop_time governs; no artificial step cap

# Physical scales: SetAtolFromPhysics() derives all integrator.atol_* values from these.
# typical_minimal_radiation_T = 10 K is the minimum temperature at which radiation is physically
# meaningful (photon field at this T becomes negligible after ~1e6 VODE steps via the 1e-6 prefactor).
# Erad_floor (M1 floor) is C::a_rad * 1e-8 (T~0.01 K) in testDTypeFront.cpp — see docs/markdown/photoionization.md.
integrator.typical_n_H                      = 139.9  # cm^-3; representative total H number density
integrator.desired_accuracy_on_T_at_typical_n_H = 1.0   # K; temperature accuracy (sets atol_enuc)
integrator.typical_minimal_radiation_T      = 10.0  # K; minimum physically significant radiation T

# Derived atol values (computed by SetAtolFromPhysics):
#   atol_spec                    = 1.4e-3     # cm^-3;   spec_abundance_tol (1e-5) × typical_n_H
#   atol_enuc                    = 1.24e8     # erg/g;   c_v × desired_accuracy_on_T (1 K)
#   atol_rad_num                 = 1.25e-6    # cm^-3;   1e-6 × a_rad × T_min^4 / E_photon
#   radiation_failure_tolerance  = 0.05       # cm^-3;   physical guard, overridable (default)

integrator.rtol_spec     = 1e-2
integrator.rtol_rad_num  = 1e-2
integrator.rtol_enuc     = 1e-2

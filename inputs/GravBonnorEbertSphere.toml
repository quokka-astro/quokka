# Bonnor-Ebert Sphere with dust self-gravity

# *****************************************************************
# Problem size and geometry
# *****************************************************************
# Domain is ~3x the sphere radius for rho_c = 3e-18 g/cm^3
# Sphere radius R = xi_crit * c_s/sqrt(4*pi*G*(1+f)*rho_c) = 5.41e16 cm
geometry.prob_lo = [-1.6e17, -1.6e17, -1.6e17]
geometry.prob_hi = [1.6e17, 1.6e17, 1.6e17]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 0

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [64, 64, 64]
amr.max_level = 0
amr.blocking_factor = 32
amr.max_grid_size = 64
amr.n_error_buf = 3
amr.grid_eff = 0.7

# *****************************************************************
# Simulation control
# *****************************************************************
hydro.reconstruction_order = 3
cfl = 0.3
max_timesteps = 100
#stop_time = 1.2128e11  # ~0.1 t_ff (stability test)
stop_time = 1.2128e12  # ~1 t_ff (stability test)
init_shrink = 0.1

do_reflux = 1
do_subcycle = 0

derived_vars = "gpot"

# *****************************************************************
# Problem parameters
# *****************************************************************
problem.rho_c = 3.0e-18            # central density [g/cm^3]
problem.overdensity_factor = 1.0    # 1.0 = critical (stable), >1.0 = collapse, <1.0 = expand

tiny_profiler.enabled = 0
suppress_output = 0

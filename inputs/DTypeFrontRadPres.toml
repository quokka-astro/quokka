# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo     =  [0.0, 0.0, 0.0]
geometry.prob_hi     =  [1.596e19, 1.596e19, 1.596e19]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [64, 64, 64]
amr.max_level       = 0     # number of levels = max_level + 1
amr.blocking_factor = 32  # grid size must be divisible by this
amr.max_grid_size = 128  # at least 128 for GPUs
do_reflux = 0
do_subcycle = 0
suppress_output = 0

# Radiation-pressure-influenced regime of Krumholz & Matzner (2009).
# With n_H = 1e4 cm^-3 and Q = 1.56e51 s^-1, their Eq. 8 gives zeta ~ 10 for the paper's
# fiducial f_trap = 2. However, the code deposits only the DIRECT ionizing-photon momentum
# (f_trap ~ 1), and since zeta ~ f_trap^2, the physically relevant value here is zeta ~ 2.5:
# radiation pressure is important but not deeply dominant. (Corner source + reflecting BCs
# make this one octant of a sphere = the embedded case.) For these parameters (T_eq ~ 1.05e4 K)
# the Spitzer time is t_s ~ 1.87e12 s.
# stop_time = 5 t_s ~ 9.34e12 s. The numerical front reaches ~3.5 pc, inside the 5.17 pc box,
# and leads the Spitzer solution -- the radiation-pressure boost. The numerical front lands
# BETWEEN the pure Spitzer solution and the KM09 combined (radiation + gas) solution, as
# expected for this crossover regime.
stop_time = 9.34e12 # ~ 5 t_s

stromgen.primary_species_1 = 1.0e-10
stromgen.primary_species_2 = 1.0e4      # n_H = 1e4 cm^-3 (radiation-pressure regime; was 139.9)
stromgen.primary_species_3 = 1.0e-10
stromgen.Q = 1.56e51                     # ionizing rate; S49 = 156 -> zeta ~ 2.5 at f_trap=1 (was 4e46)
stromgen.temperature = 37.11

# Krumholz & Matzner (2009) radiation-pressure analytic solution parameters. The KM09 combined
# curve is r = (r_rad^p + r_gas^p)^(1/p) with r_rad = [3 f_trap L/(2 pi c rho0)]^(1/4) sqrt(t)
# (dimensional Eq. 11) and r_gas the code's own Spitzer radius; L = psi * S * eps0, rho0 = mu_amb
# * m_p * n_H. See the testDTypeFrontRadPres.cpp header comment.
# f_trap = 1: the code deposits only the DIRECT ionizing-photon momentum, so f_trap ~ 1 is the
# physically consistent choice (the paper's Table/figures use f_trap = 2). r_rad ~ f_trap^(1/4).
radpres.f_trap = 1.0
radpres.psi    = 1.0
radpres.mu_amb = 1.4

photochemistry.enabled = 1
integrator.use_number_densities = 1
integrator.do_species_clip = 0
integrator.jacobian = 1
integrator.renormalize_abundances = 0
integrator.subtract_internal_energy = 0
integrator.X_reject_buffer = 1e100
integrator.ode_max_steps = 50000

plotfile_interval = -1
plotfile_prefix = "DTypeRadPres"

network.allow_mixed_cell_cooling = 0


max_timesteps = 1000000  # stop_time governs; no artificial step cap

# VODE absolute tolerances. NOTE: these were tuned for the original DTypeFront at n_H = 139.9
# cm^-3. This problem runs at n_H = 1e4 cm^-3 (~70x denser), so several atol values that are
# expressed as absolute number densities (atol_spec, atol_rad_num, species/radiation failure
# tolerances) may need to be rescaled up by a similar factor. Start here and adjust if VODE
# spends excessive steps or the step-rejection loop triggers at the ionization front.
#
# atol_spec = 1e-5 * n_H = physical negligibility floor -> 1e-5 * 1e4 = 0.1 cm^-3.
integrator.atol_spec                     = 1.0e-1   # cm^-3; 1e-5 x n_H (n_H = 1e4)
integrator.atol_enuc                     = 1.24e8   # erg/g; c_v x 1 K temperature accuracy
integrator.atol_rad_num                  = 1.0e-1     # cm^-3;
integrator.species_failure_tolerance     = 1.0e-1   # cm^-3; = atol_spec
integrator.radiation_failure_tolerance   = 0.5      # cm^-3; must exceed max N_gamma BDF overshoot at ionization front

integrator.rtol_spec     = 1e-2
integrator.rtol_rad_num  = 1e-2
integrator.rtol_enuc     = 1e-2

integrator.rosenbrock_tableau = 3

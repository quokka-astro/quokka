# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
quokka.bc = ["periodic", "periodic", "periodic"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 1  # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [64, 8, 8]
amr.max_level = 0  # number of levels = max_level + 1

amr.max_grid_size_x = 64
amr.max_grid_size_y = 8
amr.max_grid_size_z = 8
amr.blocking_factor_x = 32
amr.blocking_factor_y = 8
amr.blocking_factor_z = 8

do_reflux = 0
do_subcycle = 0

plotfile_interval = -1
checkpoint_interval = -1
cfl = 0.3
max_timesteps = 2000

hydro.rk_integrator_order = 2
hydro.reconstruction_order = 5
hydro.use_dual_energy = 0

setup.run_convergence = false
setup.run_sim = true
setup.error_tol = 0.002
setup.num_periods = 1
setup.num_modes_x = 1
setup.num_modes_y = 0
setup.num_modes_z = 0
setup.angle_between_k_b0 = 90.0

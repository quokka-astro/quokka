# *****************************************************************
# Problem size and geometry
# *****************************************************************
# Source at the centre, 2.5 pc from each wall: at stop_time the H front reaches ~1.6 pc and the warm layer ahead of it ~1.9 pc (256^3 octant run).
geometry.prob_lo     =  [0.0, 0.0, 0.0]
geometry.prob_hi     =  [1.5428387907e19, 1.5428387907e19, 1.5428387907e19] # = 5 pc
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [128, 128, 128]
amr.max_level       = 0     # number of levels = max_level + 1
amr.blocking_factor = 32  # grid size must be divisible by this
amr.max_grid_size = 128  # at least 128 for GPUs
do_reflux = 0
do_subcycle = 0
suppress_output = 0

stop_time = 5.107737479e12 # = stop_time of DTypeFront_JAFF.toml (5 t_s of the pure-H problem)

# Neutral H + He mix, mass fractions X_H = 2/3, X_He = 1/3 (n_HeI_init = 0.5 * n_HI_init * m_H / m_He).
stromgen.n_e_init = 1.0e-10
stromgen.n_HI_init = 139.9
stromgen.n_HII_init = 1.0e-10
stromgen.n_HeI_init = 17.615421194067892
stromgen.n_HeII_init = 1.0e-10
stromgen.n_HeIII_init = 1.0e-10
stromgen.Q = 4e46
stromgen.temperature = 37.11

integrator.X_reject_buffer = 1e100
integrator.ode_max_steps = 500000

plotfile_interval = 100
plotfile_prefix = "DTypeHe"

max_timesteps = 1000000  # stop_time governs; no artificial step cap

# The paper's tolerances (sec:performance:tolerance): rtol = 1e-2, atol_i = rtol * s_i with scales
# s_spec = 1e-3 cm^-3, s_enuc = 1e8 erg/g, s_rad_num = 0.1 cm^-3; failure tolerances = 5 atol.
integrator.rtol_spec     = 1e-2
integrator.rtol_rad_num  = 1e-2
integrator.rtol_enuc     = 1e-2
integrator.atol_spec     = 1e-5
integrator.atol_enuc     = 1e6
integrator.atol_rad_num  = 1e-3
integrator.species_failure_tolerance   = 5e-5
integrator.radiation_failure_tolerance = 5e-3

density_floor = 1e-28  # g cm^-3

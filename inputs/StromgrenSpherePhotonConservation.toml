# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo     =  [0.0, 0.0, 0.0] 
geometry.prob_hi     =  [1.45e22, 1.45e22, 1.45e22]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [16, 16, 16]
amr.max_level       = 0     # number of levels = max_level + 1
#max_timesteps = 10
do_reflux = 0
do_subcycle = 0
suppress_output = 0

# R_c = sqrt(Q / (16 pi n c)) = 1.63e21 cm, t_c = R_c / c = 5.43e10 s. t_end = 50 t_c, when the front is at
# R = 7.96 R_c = 1.30e22 cm = 0.89 L (5 mean free paths inside the box), moving at c/17 with 16% of the photons in flight
stromgen.tend = 2.72e12
stromgen.n_e_init = 1.0e-30
stromgen.n_HI_init = 1.0e-3
stromgen.n_HII_init = 1.0e-30
stromgen.Q = 4e51

integrator.X_reject_buffer = 1e100

# atol_i = rtol * s_i. s_gamma = 1e-5 cm^-3: the photon density at the front is n_H * (dR/dt) / c >= n_H / 17 = 6e-5 cm^-3.
# s_X = 1e-7 cm^-3: residual HI at this density gives an optical depth sigma * s_X * R < 0.01 across the ionized region.
integrator.rtol_spec                   = 1e-2
integrator.rtol_rad_num                = 1e-2
integrator.atol_spec                   = 1e-9
integrator.atol_rad_num                = 1e-7
integrator.species_failure_tolerance   = 5e-9
integrator.radiation_failure_tolerance = 5e-7

plotfile_interval = 10
plotfile_prefix = "StrmPhotonCons"

network.recombination_switch = 0
network.recombination_temperature_dependent = 0
network.energy_switch = 0
network.collisional_ionization_switch = 0

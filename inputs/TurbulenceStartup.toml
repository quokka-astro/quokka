# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
geometry.is_periodic = [1, 1, 1]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 0  # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [32, 32, 32]
amr.max_level = 0  # number of levels = max_level + 1
amr.blocking_factor = 32  # grid size must be divisible by this
amr.max_grid_size = 128  # at least 128 for GPUs

stop_time = 0.2823940639272946
plotfile_interval = -1
max_timesteps = 100000

do_reflux = 0
do_subcycle = 0
hydro.artificial_viscosity_coefficient = 0.1

turbulence.enabled = 1
turbulence.remove_mean_flow = 1
turbulence.length = 1.0
turbulence.target_vdisp = 4.57
turbulence.ampl_factor = 1.5
turbulence.ampl_auto_adjust = 1
turbulence.k_driv = 4.649213465060362
turbulence.k_min = 1.0
turbulence.k_max = 2.0
turbulence.sol_weight = 0.5
turbulence.spect_form = 2
turbulence.random_seed = 140281
turbulence.nsteps_per_t_turb = 10

# Issue #2347 periodic isothermal proxy: target Mach 4.57, six OU times.
# This is not the original radiatively cooled spherical-cloud problem.
turbulence.power_law_exp = -2
turbulence.angles_exp = 1
turbulence.ampl_auto_adjust_method = "proportional"
turbulence.ampl_proportional_gain = 60
turbulence.ampl_max_amplitude = 20
problem.check_startup = true

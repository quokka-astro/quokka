# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo     =  [0.0, 0.0, 0.0] 
geometry.prob_hi     =  [2.1e22, 2.1e22, 2.1e22]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [16, 16, 16]
amr.max_level       = 0     # number of levels = max_level + 1
#max_timesteps = 10
do_reflux = 0
do_subcycle = 0
suppress_output = 0

stromgen.tend = 1.6e16
stromgen.primary_species_1 = 1.0e-10
stromgen.primary_species_2 = 1.0e-3
stromgen.primary_species_3 = 1.0e-10
stromgen.Q = 5e48

photochemistry.enabled = 1
integrator.use_number_densities = 1
integrator.do_species_clip = 0
integrator.jacobian = 1
integrator.renormalize_abundances = 0
integrator.subtract_internal_energy = 0
integrator.X_reject_buffer = 1e100
integrator.rosenbrock_tableau = 3

integrator.atol_spec = 1e-11
integrator.atol_rad_num = 1e-11
integrator.atol_rad_flux = 1e-8
integrator.atol_enuc = 1e4

integrator.rtol_spec = 1e-2
integrator.rtol_rad_num = 1e-2
integrator.rtol_rad_flux = 1e-2
integrator.rtol_enuc = 1e-2

plotfile_interval = 500
plotfile_prefix = "StrmConstRecRSLA"

network.recombination_switch = 1
network.recombination_temperature_dependent = 0
network.energy_switch = 0
network.collisional_ionization_switch = 0
network.small_x = 1e-10

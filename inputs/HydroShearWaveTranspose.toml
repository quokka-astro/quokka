# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
quokka.bc = ["periodic", "periodic", "periodic"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 0  # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [128, 8, 8]
amr.max_level = 0  # number of levels = max_level + 1
amr.blocking_factor = 8  # grid size must be divisible by this
amr.max_grid_size = 32

do_reflux = 0
do_subcycle = 0
plotfile_interval = -1
stop_time = 1.0
max_timesteps = 20000

hydro.use_dual_energy = 0
hydro.shear_viscosity = 0.005

# same physical setup as HydroShearWave.toml, with the flow/gradient axes swapped (v_y(x) instead of
# v_x(y)) -- checks that ComputeViscousFlux's cross-derivative terms are direction-independent
setup.shear_flow_axis = 1
setup.shear_grad_axis = 0
setup.error_tol = 1.0e-8

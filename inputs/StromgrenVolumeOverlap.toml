# Strömgren-volume photoionization feedback with two co-located ionizing sources.
# Same binary as StromgrenVolumeFeedback. Both star particles sit at the domain centre, so the
# combined region must be the Strömgren volume for the summed rate 2Q -- i.e. R = 2^(1/3) R_St -- and
# the total recombination rate inside it must equal 2Q exactly. If the second source were charged for
# recombinations the first had already paid for, both checks would fail.

geometry.prob_lo = [-6.1714e18, -6.1714e18, -6.1714e18]
geometry.prob_hi = [ 6.1714e18,  6.1714e18,  6.1714e18]
quokka.bc = ["foextrap", "foextrap", "foextrap"]

amr.n_cell = [64, 64, 64]
amr.max_level = 0
amr.blocking_factor = 16
amr.max_grid_size = 32

do_reflux = 1
do_subcycle = 0
do_tracers = 0

stop_time = 1.0e11 # s
max_timesteps = 3

particles.verbose = 1

problem.star_file = "../inputs/star2.txt"
problem.n_sources = 2

stromgren.enabled = 1
stromgren.T_HII = 1.0e4
stromgren.alpha_B = 2.59e-13
stromgren.hydrogen_mass_fraction = 1.0
stromgren.R_max_cells = 32.0
stromgren.x_ion_scalar_index = 0

plotfile_interval = -1
checkpoint_interval = -1
tiny_profiler.enabled = 0

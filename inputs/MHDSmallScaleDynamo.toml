# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo = [0.0, 0.0, 0.0]
geometry.prob_hi = [1.0, 1.0, 1.0]
geometry.is_periodic = [1, 1, 1]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 0  # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [64, 64, 64]  # base grid resolution (nx, ny, nz)
amr.max_level = 0  # number of AMR levels = max_level + 1
amr.blocking_factor = 32  # grid patches must be divisible by this; must be >= nghost
amr.max_grid_size = 128  # maximum patch size per MPI rank; at least 128 for GPUs

# *****************************************************************
# Timestepping
# *****************************************************************
cfl = 0.3  # Courant number
stop_time = 100  # simulation end time (in code units)
max_timesteps = 100000  # hard cap on number of timesteps
do_reflux = 1  # apply flux correction at AMR level boundaries
do_subcycle = 0  # disable AMR subcycling; moot here (single level) but harmless

# *****************************************************************
# Output
# *****************************************************************
plotfile_interval = 100  # write a plotfile every N timesteps
checkpoint_interval = 1000  # write a restart checkpoint every N timesteps

# *****************************************************************
# Dissipation: ideal MHD, no explicit resistivity; hydro has no physical
# viscosity implementation, only numerical (truncation-error) dissipation
# *****************************************************************
mhd.resistivity = 0.0  # Ohmic resistivity

# *****************************************************************
# Seed magnetic field (ABC field)
# *****************************************************************
setup.seed_b_wavenumber = 2  # integer mode number n; k0 = 2*pi*n/L (default: 2)
setup.seed_b_fraction = 1.0e-6  # E_mag/E_kin at t=0; B0 = sqrt(fraction) * target_vdisp

# *****************************************************************
# Turbulent driving
# *****************************************************************
turbulence.enabled = 1  # enable turbulent driving
turbulence.length = 1.0  # physical box size L; integer mode n has wavenumber k = n * 2*pi / L
turbulence.target_vdisp = 0.5  # target velocity dispersion; equiv to Mach number since the plasma is isothermal
turbulence.ampl_factor = 0.828  # scales the driving amplitude as ampl_factor^1.5; retuned from 0.5 to hit target_vdisp (measured M_rms=0.302 at ampl_factor=0.5)
turbulence.ampl_auto_adjust = 0  # keep off for SSD: varying amplitude complicates dynamo growth rate measurement
turbulence.spect_form = 1  # 0: band (flat), 1: parabola (peak at midpoint of k_min and k_max), 2: power law
turbulence.k_min = 1.0  # minimum driven wavenumber
turbulence.k_max = 3.0  # maximum driven wavenumber; parabola peaks at k=2
turbulence.k_driv = 2.0  # OU autocorrelation time t_decay = L / (k_driv * vdisp); matches the driving peak
turbulence.nsteps_per_t_turb = 10  # number of OU pattern updates per t_decay; controls temporal smoothness of forcing
turbulence.sol_weight = 1.0  # 0: purely compressive, 0.5: natural mix, 1: purely solenoidal
turbulence.random_seed = 260303  # random seed for the OU phase sequence

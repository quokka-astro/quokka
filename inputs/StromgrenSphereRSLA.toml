# *****************************************************************
# Problem size and geometry
# *****************************************************************
# the source at the centre; the box extends 1.27 r_S (r_S = 1.656e22 cm) from it on each side
geometry.prob_lo     =  [-2.1e22, -2.1e22, -2.1e22]
geometry.prob_hi     =  [2.1e22, 2.1e22, 2.1e22]
quokka.bc = ["reflecting", "reflecting", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v              = 0       # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell          = [16, 16, 16]
amr.max_level       = 0     # number of levels = max_level + 1
#max_timesteps = 10
do_reflux = 0
do_subcycle = 0
suppress_output = 0

# 5 t_rec, t_rec = 1 / (alpha_B n_H) = 3.80e15 s
stromgen.tend = 1.901141e16
stromgen.n_e_init = 1.0e-30
stromgen.n_HI_init = 1.0e-3
stromgen.n_HII_init = 1.0e-30
stromgen.Q = 5e48

integrator.X_reject_buffer = 1e100

# atol_i = rtol * s_i. s_gamma = 1e-10 cm^-3: at c_hat = c the photon density at the front is alpha_B n_H / (sigma c) = 2.7e-9 cm^-3
# when photoionization balances recombination, and n_H (dR/dt) / c = 3e-10 cm^-3 at 5 t_rec (larger by c / c_hat for c_hat < c).
# s_X = 1e-7 cm^-3: residual HI at this density gives an optical depth sigma * s_X * r_S < 0.01 across the ionized region.
integrator.rtol_spec                   = 1e-2
integrator.rtol_rad_num                = 1e-2
integrator.atol_spec                   = 1e-9
integrator.atol_rad_num                = 1e-12
integrator.species_failure_tolerance   = 5e-9
integrator.radiation_failure_tolerance = 5e-12

plotfile_interval = 5000
plotfile_prefix = "StrmConstRecRSLA"

network.recombination_switch = 1
network.recombination_temperature_dependent = 0
network.energy_switch = 0
network.collisional_ionization_switch = 0

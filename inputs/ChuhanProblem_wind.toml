# Minimal input to exercise WR and AGB continuous yield deposition
particles.verbose = 0
particles.eps_ff = 0.5
particles.enable_chemical_feedback = 1
particles.enable_SNII_metal = 1
particles.enable_WR_metal = 1
particles.enable_AGB_metal = 1
particles.store_channel_fields = 1
particles.chemical_scalar_offset = 0
particles.chemical_num_scalars = 3
particles.use_table_driven_chemical_yield = 1
particles.chemical_yield_table_file = "../extern/yields"
particles.chemical_tracked_isotopes = "C12,O16,Fe56"
particles.chemical_tracked_channels = "SNII,WR,AGB"
particles.stellar_metallicity_fraction = 0.02

# Make WR/AGB active over the simulation window
particles.wr_age_start = 0.0
particles.wr_age_end = 1.0e20
particles.agb_age_start = 0.0
particles.agb_age_end = 1.0e20

problem.n0 = 1.0e5
problem.Tamb = 1.0e1
problem.initial_particles_file = "../inputs/ChuhanProblem_wind_particles.txt"

max_timesteps = 10
initial_dt = 1.0e13
plotfile_interval = 10
checkpoint_interval = 0

plotfile_prefix = "/Users/meow/quokka/tests/chuhan_wind/plt"

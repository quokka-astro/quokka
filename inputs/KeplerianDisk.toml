# A gas-only version of DiskGalaxy in a fixed spherical potential.

geometry.prob_lo = [-1.8514065526075864e24, -1.8514065526075864e24, -1.8514065526075864e24]
geometry.prob_hi = [1.8514065526075864e24, 1.8514065526075864e24, 1.8514065526075864e24]
geometry.is_periodic = [0, 0, 0]

amr.v = 1
amr.n_cell = [128, 128, 128]
amr.max_level = 5
amr.blocking_factor = 32
amr.max_grid_size = 128
amr.n_error_buf = 3
amr.grid_eff = 0.7
regrid_interval = -1

do_reflux = 1
do_subcycle = 0
do_tracers = 0

max_walltime = "0:05:00"
cfl = 0.3
init_shrink = 0.01
stop_time = 3.1536e16
dt_cutoff = 1.0e-12
max_timesteps = 1000

hydro.reconstruction_order = 3
temperature_floor = 1.0e4
density_floor = 1.0e-28
density_floor_expr = "x1=x*1.0e-22; y1=y*1.0e-22; z1=z*1.0e-22; r2=x1*x1+y1*y1+z1*z1; rb2=3.08567758*3.08567758; base_density_floor * (rb2 / max(r2, rb2))"

checkpoint_interval = 10000
plotfile_interval = 10000
statistics_interval = -1

# These are deliberately the same ParmParse names used by DiskGalaxy.
disk_galaxy.vcirc_file = "../extern/agora_data/vcirc_with_constant_halo.csv"
disk_galaxy.refine_Rmax_kpc = 16.0
disk_galaxy.refine_zmax_kpc = 4.0
disk_galaxy.disk_gas_mass_Msun = 8.59322e9
disk_galaxy.disk_Rscale_kpc = 3.43218
disk_galaxy.disk_zscale_kpc = 0.343218
disk_galaxy.disk_temperature = 1.0e4
disk_galaxy.disk_perturb_amplitude = 1.0
disk_galaxy.disk_perturb_Rmax_kpc = 20.0

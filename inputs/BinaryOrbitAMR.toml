# *****************************************************************
# Problem size and geometry
# *****************************************************************
geometry.prob_lo = [-2.5e13, -2.5e13, -2.5e13]
geometry.prob_hi = [2.5e13, 2.5e13, 2.5e13]
quokka.bc = ["periodic", "periodic", "reflecting"]

# *****************************************************************
# VERBOSITY
# *****************************************************************
amr.v = 1  # verbosity in Amr

# *****************************************************************
# Resolution and refinement
# *****************************************************************
amr.n_cell = [32, 32, 32]
amr.max_level = 1  # number of levels = max_level + 1
amr.blocking_factor = 8   # in level-1 cells; small enough that the x >= 0 tag survives blocking
amr.max_grid_size = 32  # at least 128 for GPUs
amr.n_error_buf = 3  # minimum 3 cell buffer around tagged cells
amr.grid_eff = 1.0

# Static mesh refinement: level 1 covers the x >= 0 half of the domain, so the binary
# orbits across a fixed coarse/fine boundary at x = 0 in addition to the refinement that
# follows the particles. This exercises gravitational self-force errors at the refinement
# boundary (Zhu & Gnedin 2021, arXiv:2104.10170).
problem.refine_x_min = 0.0

cfl = 0.3
max_timesteps = 2000
stop_time = 5.0e7  # s

do_reflux = 1
do_subcycle = 0

checkpoint_interval = -1
#plottime_interval = 2.0e5 # s
plotfile_interval = -1
derived_vars = "gpot"
